[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fuseembeditor"
version = "1.0.0"
description = "Modality-specialised embedding fusion for base editing efficiency prediction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "data/LICENSE",
    "benchmark/models/**/LICENSE",
    "benchmark/models/**/COPYING",
    "benchmark/models/crispron_be/licenses/*",
]
authors = [
    { name = "Lucas Schneider", email = "lucas.schneider@cs.ox.ac.uk" },
    { name = "Peter Minary", email = "peter.minary@cs.ox.ac.uk" },
]
keywords = ["base editing", "CRISPR", "DNA foundation models", "multimodal fusion"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.2",
    "transformers>=4.51,<5",
    "accelerate>=0.26",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.7,<1.8",
    "joblib>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ablations = [
    "einops>=0.7",
    "mamba-ssm",
    "causal-conv1d",
]
benchmark = [
    "biopython>=1.83,<1.86",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "tensorflow>=2.16,<2.20",
    "tf-keras>=2.16,<2.20",
    "ViennaRNA>=2.5,<2.8",
]

[project.urls]
Repository = "https://github.com/Lucas749/FuseEmBEditor"

[project.scripts]
fuseembeditor-embeddings = "scripts.generate_embeddings:main"
fuseembeditor-train = "scripts.train:main"
fuseembeditor-reproduce = "scripts.reproduce:main"
fuseembeditor-benchmark = "benchmark.cli:main"
fuseembeditor-crispron-scores = "benchmark.adapters.crispron_scores:main"

[tool.setuptools.packages.find]
include = ["fuseembeditor*", "benchmark*", "data", "scripts"]

[tool.setuptools.package-data]
benchmark = [
    "data/*.gz",
    "models/*/*.json",
    "models/*/LICENSE",
    "models/*/COPYING",
    "models/forecast_be/saved_models/*/*.joblib",
    "models/crispron_be/licenses/*",
    "models/crispron_be/crisproff-1.1.2/*",
    "models/crispron_be/crispron-1.0/*",
    "models/crispron_be/crispron-1.0/CRISPRon_models_V0/best/*/saved_model.pb",
    "models/crispron_be/crispron-1.0/CRISPRon_models_V0/best/*/variables/*",
]
data = ["*.jsonl.gz", "LICENSE"]
