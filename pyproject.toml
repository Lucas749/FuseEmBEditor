[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuseembeditor"
version = "1.0.0"
description = "Modality-specialised embedding fusion for base editing efficiency prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Lucas Schneider", email = "lucas.schneider@cs.ox.ac.uk" },
    { name = "Peter Minary", email = "peter.minary@cs.ox.ac.uk" },
]
keywords = ["base editing", "CRISPR", "DNA foundation models", "multimodal fusion"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.2",
    "transformers>=4.50,<5",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ablations = ["einops>=0.7"]

[project.urls]
Repository = "https://github.com/Lucas749/FuseEmBEditor"

[tool.setuptools.packages.find]
include = ["fuseembeditor*"]
